name: CI

# Project structure:
# Continuous integration to develop branch
# Continuous delivery to main branch (manually)

# Checks every PR + pushes to develop and main
# Concurrency: A new push to the same branch cancels the run that is already in progress, to prevent unnecessary queueing

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # expo-env.d.ts is git-ignored and normally generated by `expo start`
      # CI starts from a clean checkout, so the file does not exist
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts

      - run: npm run typecheck

      # The root tsconfig excludes scripts/, so the backend is typechecked separately
      - name: Typecheck backend
        run: npx tsc --noEmit -p scripts/tsconfig.json

      - run: npm run lint

      # The app throws at startup without the Supabase variables (public keys only)
      - run: npm run build:web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
