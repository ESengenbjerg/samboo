name: CI

# Project structure:
# Continuous integration to develop branch
# Continuous delivery to main branch (manually)

# This CI file aims to check on PRs and merge to develop and main branches.
# Concurrency is added for more effective flow (i.e a PR is opened and CI starts, then you make a small change in code, commits and push, another CI is queued to start. Instead of first CI finishing before the second could start, the first will be aborted)

# 'npx js-yaml' is helpful during development of this file
# uses: - runs an existing action
# run: - runs a Terminal command

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # expo-env.d.ts is git-ignored and normally generated by `expo start`
      # CI starts from a clean checkout, so the file does not exist
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts

      - run: npm run typecheck

      # Lint is disabled until the existing react-hooks errors are fixed
      # - run: npm run lint

      # The app throws at startup without the Supabase variables (public keys only)
      - run: npm run build:web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
