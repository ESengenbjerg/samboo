name: Scrape listings

# NOTE! In GitHub Action Secrets - needs to put in dotenv variables PRIOR to first test run!

on:
  schedule:
    # Once a day. GitHub cron is always UTC: 02:12 UTC = 03:12 Swedish winter time,
    # 04:12 summer time. Off the hour on purpose, GitHub delays jobs queued at :00
    - cron: "12 2 * * *"

  workflow_dispatch: # Manual run from the Actions tab, and backup trigger from pg_cron
    inputs:
      skip_if_recent:
        description: "Skip if already run successfully in the last 12 hours (used by pg_cron)"
        type: boolean
        default: false

permissions:
  contents: read

# Never run two scrapes at once
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  # Backup trigger: pg_cron in Supabase also starts this workflow (workflow_dispatch with skip_if_recent = true), because GitHub's schedule does not always fire. Scheduled and pg_cron runs are skipped if the scrape job already succeeded in the last 12 hours.
  # Runs where the scrape job itself was skipped do not count.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read # List earlier runs of this workflow
    outputs:
      recent: ${{ steps.check.outputs.recent }}
    steps:
      - name: Check for a successful scrape in the last 12 hours
        id: check
        # A manual run from the Actions tab (skip_if_recent = false) always runs
        if: github.event_name == 'schedule' || inputs.skip_if_recent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '-12 hours' +%Y-%m-%dT%H:%M:%SZ)
          recent=false
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow scrape.yml --status success \
                        --created ">=$since" --json databaseId --jq '.[].databaseId'); do
            if gh run view "$id" --repo "$GITHUB_REPOSITORY" --json jobs \
                 --jq '.jobs[] | select(.name == "scrape" and .conclusion == "success") | .name' | grep -q .; then
              recent=true
              break
            fi
          done
          echo "Successful scrape in the last 12 hours: $recent"
          echo "recent=$recent" >> "$GITHUB_OUTPUT"

  scrape:
    needs: guard
    if: needs.guard.outputs.recent != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: scripts/.nvmrc # Node 24 runs .ts files natively
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # run.ts calls process.loadEnvFile(".env"), which throws if the file is missing.
      # An empty file is fine: variables already in the environment are not overwritten.
      - run: touch .env

      - name: Scrape and match
        run: node scripts/scraper/run.ts
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BASE_PATH_MOCK_DATA: ${{ secrets.BASE_PATH_MOCK_DATA }}
          BASE_PATH_AGENCY1: ${{ secrets.BASE_PATH_AGENCY1 }}
