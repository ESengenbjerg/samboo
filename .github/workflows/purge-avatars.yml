name: Purge orphan avatars

# Deletes avatar files that no profile points to (see scripts/avatars/purgeOrphanAvatars.ts)

on:
  schedule:
    # GitHub cron is UTC. Off the hour on purpose, GitHub delays jobs queued at :00
    - cron: "41 2 * * *"

  workflow_dispatch:
    inputs:
      skip_if_recent:
        description: "Skip if already run successfully in the last 12 hours (used by pg_cron)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: purge-avatars
  cancel-in-progress: false

jobs:
  # pg_cron also starts this workflow, because GitHub's schedule does not always fire.
  # Scheduled and pg_cron runs are skipped if the purge job already succeeded in the last 12 hours.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      recent: ${{ steps.check.outputs.recent }}
    steps:
      - name: Check for a successful purge in the last 12 hours
        id: check
        continue-on-error: true # If the check fails, run anyway instead of skipping
        # Manual runs always run
        if: github.event_name == 'schedule' || inputs.skip_if_recent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '-12 hours' +%Y-%m-%dT%H:%M:%SZ)
          recent=false
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow purge-avatars.yml --status success \
                        --created ">=$since" --json databaseId --jq '.[].databaseId'); do
            if gh run view "$id" --repo "$GITHUB_REPOSITORY" --json jobs \
                 --jq '.jobs[] | select(.name == "purge" and .conclusion == "success") | .name' | grep -q .; then
              recent=true
              break
            fi
          done
          echo "Successful purge in the last 12 hours: $recent"
          echo "recent=$recent" >> "$GITHUB_OUTPUT"

  purge:
    needs: guard
    if: needs.guard.outputs.recent != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: scripts/.nvmrc # Node 24 runs .ts files natively
          cache: npm

      - run: npm ci

      # process.loadEnvFile() throws without a .env file. An empty one is fine
      - run: touch .env

      - name: Purge orphan avatars
        run: node scripts/avatars/purgeOrphanAvatars.ts
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
