name: Purge orphan avatars

# Deletes avatar files in Storage that no profile points to (see scripts/avatars/purgeOrphanAvatars.ts).
# NOTE! The secrets must exist in GitHub Action Secrets before the first run.

on:
  schedule:
    # Once a day. GitHub cron is always UTC. Off the hour on purpose, GitHub delays jobs queued at :00
    - cron: "41 2 * * *"

  workflow_dispatch: # Manual run from the Actions tab, and backup trigger from pg_cron
    inputs:
      skip_if_recent:
        description: "Skip if already run successfully in the last 12 hours (used by pg_cron)"
        type: boolean
        default: false

permissions:
  contents: read

# Never run two purges at once
concurrency:
  group: purge-avatars
  cancel-in-progress: false

jobs:
  # Backup trigger: pg_cron in Supabase also starts this workflow (workflow_dispatch with skip_if_recent = true), because GitHub's schedule does not always fire. Scheduled and pg_cron runs are skipped if the purge job already succeeded in the last 12 hours.
  # Runs where the purge job itself was skipped do not count.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read # List earlier runs of this workflow
    outputs:
      recent: ${{ steps.check.outputs.recent }}
    steps:
      - name: Check for a successful purge in the last 12 hours
        id: check
        # A manual run from the Actions tab (skip_if_recent = false) always runs
        if: github.event_name == 'schedule' || inputs.skip_if_recent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '-12 hours' +%Y-%m-%dT%H:%M:%SZ)
          recent=false
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow purge-avatars.yml --status success \
                        --created ">=$since" --json databaseId --jq '.[].databaseId'); do
            if gh run view "$id" --repo "$GITHUB_REPOSITORY" --json jobs \
                 --jq '.jobs[] | select(.name == "purge" and .conclusion == "success") | .name' | grep -q .; then
              recent=true
              break
            fi
          done
          echo "Successful purge in the last 12 hours: $recent"
          echo "recent=$recent" >> "$GITHUB_OUTPUT"

  purge:
    needs: guard
    if: needs.guard.outputs.recent != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: scripts/.nvmrc # Node 24 runs .ts files natively
          cache: npm

      - run: npm ci

      - name: Typecheck backend
        run: npx tsc --noEmit -p scripts/tsconfig.json

      # The script calls process.loadEnvFile(".env"), which throws if the file is missing.
      # An empty file is fine: variables already in the environment are not overwritten.
      - run: touch .env

      - name: Purge orphan avatars
        run: node scripts/avatars/purgeOrphanAvatars.ts
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
