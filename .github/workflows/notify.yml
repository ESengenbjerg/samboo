name: Send notification mails

# Sends mail weekly & daily to users with updates

on:
  schedule:
    # On schedule. GitHub cron is always UTC. Off the hour on purpose, GitHub delays jobs queued at :00
    - cron: "7 5 * * *"
    - cron: "7 6 * * *"

  # Manual run from the Actions tab, and backup trigger from pg_cron (dispatch-notify), because GitHub's schedule does not always fire
  workflow_dispatch:
    inputs:
      # Not read by this workflow. dispatch_github_workflow() in Supabase always sends it, and GitHub rejects
      # the dispatch (422) if the input is not declared. Double runs are harmless: due_emails() skips
      # users already mailed today, and Resend gets an idempotency key per user and day.
      skip_if_recent:
        description: "Unused here (sent by pg_cron). Users already mailed today are always skipped"
        type: boolean
        default: false

permissions:
  contents: read

# Never run two notifies at once
concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: scripts/.nvmrc # Node 24 runs .ts files natively
          cache: npm

      - run: npm ci

      # The script calls process.loadEnvFile(".env"), which throws if the file is missing.
      # An empty file is fine: variables already in the environment are not overwritten.
      - run: touch .env

      - name: Send notification mails
        run: node scripts/email/sendEmails.ts
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_FROM: ${{ vars.NOTIFY_FROM }}
          APP_URL: ${{ vars.APP_URL}}
