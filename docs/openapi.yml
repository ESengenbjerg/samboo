openapi: 3.0.3

info:
  title: Samboo Data API (Supabase / PostgREST)
  version: 1.0.0
  description: |
    The part of the database API that the app uses. Documentation only: the app calls it through supabase-js
    (`supabase.rpc('name', {...})` and `supabase.from('table')`), which sends the requests described here.

    This file is written by hand and describes our own rules, which PostgREST's auto-generated spec
    (`GET /rest/v1/` with the apikey header) does not know about. Source of truth for the database is
    supabase/schema.sql (a dump) and supabase/setup-extras.sql; the design is explained in docs/database-design.md. Update this file when functions, grants or policies change.

    **Common rules**
    - Every call requires a signed-in user with a confirmed e-mail and an active profile (`is_active_user()`).
      Otherwise reads return empty lists and RPC calls fail with `Ditt konto är inte aktivt`.
      Exception: the reference data (`counties`, `municipalities`, `areas`) is readable by every signed-in user.
    - `anon` has no access to anything.
    - Rate limit: at most 100 write requests (POST/PUT/PATCH/DELETE, RPC called with POST included) per user per 5 minutes.
      Reads (GET) are not counted. Over the limit gives HTTP 429 (see `RateLimited`).
    - Read-only (STABLE) functions must be called with GET (`supabase.rpc('name', undefined, { get: true })`).
      A POST makes the rate limit try to write inside a read-only transaction and fails with 405.
    - Table reads accept the usual PostgREST filters (`?column=eq.value`, `select=`, `order=`, `limit=`).
      supabase-js builds them, so they are not repeated per endpoint.

    **Profile images (Storage API, not part of this spec)**
    The image itself goes through the Storage API (`supabase.storage.from('avatars')`, served under `/storage/v1`),
    only its path is stored here in `profiles.avatar_path`. Rules enforced by the bucket and the storage.objects policies:
    - Bucket `avatars` is public: anyone with the URL can open the image. Max 2 MB, only `image/jpeg`, `image/png`, `image/webp`.
    - Upload (no upsert, a new random name every time) only into the own folder `<user id>/<name>.<jpg|jpeg|png|webp>`,
      only for active users, and at most 5 files in the folder. Otherwise Storage answers
      `new row violates row-level security policy` (statusCode 403). Too large a file gives statusCode 413.
    - Order: upload the file, then PATCH `/profiles` with `avatar_path`, then remove the previous file (best effort).
    - Delete and list only own files.

servers:
  - url: https://{project}.supabase.co/rest/v1
    variables:
      project:
        default: your-project-ref

security:
  - apikey: []
    bearerAuth: []

tags:
  - name: Groups and invites
  - name: Listings
  - name: Account
  - name: Search
  - name: Showings
  - name: Tags
  - name: Notifications

paths:
  # ---------------------------------------------------------------------
  # RPC functions
  # ---------------------------------------------------------------------
  /rpc/accept_invite:
    post:
      tags: [Groups and invites]
      summary: Accept an invite
      description: |
        The recipient accepts a pending invite addressed to their e-mail. Joins the sender's group
        (the group is created if the sender has none) and marks the invite `accepted`.
        A group has at most 10 members. The own showings of the sender and of me move into the group.
        A pending invite from me to the sender is set to `cancelled`.
      operationId: accept_invite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_id]
              properties:
                invite_id: { type: integer, format: int64 }
      responses:
        '200':
          description: |
            My showings that did not follow into the group, because the group already had a showing
            for the same listing (empty array if none). Show them to the user so nothing disappears silently.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SkippedShowing' }
        '400':
          description: |
            Business rule violated. `message` is one of:
            `Ditt konto är inte aktivt`, `Inbjudan finns inte eller är inte din`,
            `Du är redan med i en grupp. Lämna den först.`, `Gruppen är full (max 10 medlemmar)`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /rpc/decline_invite:
    post:
      tags: [Groups and invites]
      summary: Decline an invite
      description: The recipient declines a pending invite addressed to their e-mail. The sender still sees it as `declined`.
      operationId: decline_invite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_id]
              properties:
                invite_id: { type: integer, format: int64 }
      responses:
        '200': { $ref: '#/components/responses/VoidOk' }
        '400':
          description: '`Ditt konto är inte aktivt` or `Inbjudan finns inte eller är inte din` (not mine, or no longer pending).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /rpc/cancel_invite:
    post:
      tags: [Groups and invites]
      summary: Withdraw an invite I sent
      description: |
        The sender withdraws a pending invite (for example a wrong e-mail address). The invite is kept with
        status `cancelled` so it still counts towards the 20 per pair limit. It is hidden from the recipient.
      operationId: cancel_invite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_id]
              properties:
                invite_id: { type: integer, format: int64 }
      responses:
        '200': { $ref: '#/components/responses/VoidOk' }
        '400':
          description: '`Ditt konto är inte aktivt` or `Inbjudan finns inte eller är inte din` (not mine, or no longer pending).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /rpc/my_pending_invites:
    get:
      tags: [Groups and invites]
      summary: Pending invites addressed to me
      description: |
        Lists pending invites sent to my e-mail, newest first, with the sender's name and e-mail.
        Invites from inactive senders are left out.
        Needed because the recipient cannot read the sender's profile (not in the same group).
        Must be called with GET (STABLE), see the common rules.
      operationId: my_pending_invites
      responses:
        '200':
          description: List of invites (empty if none).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PendingInvite' }

  /rpc/my_group_members:
    get:
      tags: [Groups and invites]
      summary: The other members of my group
      description: |
        Lists the other members of my group, sorted by name, with their e-mail (read from auth.users).
        Myself is not included; inactive members are. Empty list if I have no group.
        Must be called with GET (`supabase.rpc('my_group_members', undefined, { get: true })`): the function is
        STABLE, and a POST fails with 405 because the rate limit cannot write in a read-only transaction.
      operationId: my_group_members
      responses:
        '200':
          description: List of members (empty if none).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GroupMember' }

  /rpc/my_group_id:
    get:
      tags: [Groups and invites]
      summary: The id of my group
      description: Must be called with GET (STABLE), see the common rules.
      operationId: my_group_id
      responses:
        '200':
          description: My group id, or `null` if I have no group.
          content:
            application/json:
              schema: { type: integer, format: int64, nullable: true }

  /rpc/leave_group:
    post:
      tags: [Groups and invites]
      summary: Leave my group
      description: |
        The group's showings stay with the group; I start without any of my own.
        If at most 1 member remains afterwards, the group is dissolved and its showings go to that member.
      operationId: leave_group
      responses:
        '200': { $ref: '#/components/responses/VoidOk' }
        '400':
          description: '`Du är inte med i någon grupp`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /rpc/remove_group_member:
    post:
      tags: [Groups and invites]
      summary: Remove another member from my group
      description: |
        Any member can remove any other member. Same group rule as `leave_group`:
        if at most 1 member remains, the group is dissolved and its showings go to that member.
      operationId: remove_group_member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/VoidOk' }
        '400':
          description: |
            `message` is one of: `Ditt konto är inte aktivt`, `Använd "Lämna grupp" för att lämna din egen grupp`,
            `Du är inte med i någon grupp`, `Personen är inte längre med i din grupp`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /rpc/like_listing:
    post:
      tags: [Listings]
      summary: Like a listing
      description: |
        Sets `liked = true` on my `user_listings` row for the listing (the row is created if missing).
        A like counts as seen, so `is_new` is set to false as well, and the listing is recorded as seen (see `mark_listing_seen`).
        Only allowed for listings that are already visible to me, i.e. matched to me or to someone in my group.
        There is no unlike function: to remove a like, update `user_listings.liked` to false directly.
      operationId: like_listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_listing_id]
              properties:
                p_listing_id: { type: integer, format: int64 }
      responses:
        '200': { $ref: '#/components/responses/VoidOk' }
        '400':
          description: '`Ditt konto är inte aktivt` or `Annonsen finns inte eller är inte tillgänglig för dig`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /rpc/mark_listing_seen:
    post:
      tags: [Listings]
      summary: Mark a listing as seen
      description: |
        Call it when the listing page opens, whichever list it was opened from (my results, my likes, a group member's likes).
        Sets `is_new = false` on my `user_listings` row for the listing, if I have one.
        It also records the listing as seen in the database (table `seen_listings`, not readable by the app), also when I have
        no row (a group member's listing outside my search). That is what makes it disappear from `my_new_listing_ids`,
        and it keeps the listing from becoming "new" again if it stops matching my search and later matches again.
        Listings that are not visible to me are silently ignored.
        Apart from `like_listing`, this is the only way to change `is_new`; it cannot be written directly.
      operationId: mark_listing_seen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_listing_id]
              properties:
                p_listing_id: { type: integer, format: int64 }
      responses:
        '200': { $ref: '#/components/responses/VoidOk' }
        '400':
          description: '`Ditt konto är inte aktivt`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /rpc/my_new_listing_ids:
    get:
      tags: [Listings]
      summary: The listings that are new to me
      description: |
        The ids (`listings.id`) of the listings I have not opened yet, for the "Ny" flag in every list and for the notifications page:
          * my own matches with `is_new = true` (same as reading `user_listings` before), and
          * listings that a member of my group has liked, that I have no `user_listings` row for and have never opened.
        Removed listings are left out. Check a card with `ids.has(listing.id)`.
        Opening a listing (`mark_listing_seen`) or liking it removes it from the list.
        Must be called with GET (`supabase.rpc('my_new_listing_ids', undefined, { get: true })`), see the common rules.
      operationId: my_new_listing_ids
      responses:
        '200':
          description: List of ids (empty if nothing is new).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    listing_id: { type: integer, format: int64 }

  /rpc/shared_likes:
    get:
      tags: [Listings]
      summary: The shared list ("Gemensam-listan")
      description: |
        Listings that every member of my group has liked. Recalculated on every call.
        Removed listings are included: filter on `removed_at=is.null` to hide them.
        Must be called with GET (STABLE), see the common rules.
      operationId: shared_likes
      responses:
        '200':
          description: Listings (empty if I am not in a group or nothing is liked by everyone).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Listing' }

  /rpc/my_showing_events:
    get:
      tags: [Notifications]
      summary: Changes to my group's showings made by the others
      description: |
        Showings created, changed or deleted by the other members of my group in the last 30 days, newest first (max 100).
        My own changes are never included. Empty if I have no group.
        `is_unseen` is true for events newer than the last time I opened the notifications page (`mark_notifications_seen`).
        Personal showings, moves when someone joins or a group is dissolved, and changes that do not change date, time or note
        are not included. A change of the note gives `updated` with the same date and time.
        Must be called with GET (`supabase.rpc('my_showing_events', undefined, { get: true })`), see the common rules.
      operationId: my_showing_events
      responses:
        '200':
          description: List of events (empty if none).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ShowingEvent' }

  /rpc/has_new_notifications:
    get:
      tags: [Notifications]
      summary: Is there anything new since I last opened the notifications page? (the dot)
      description: |
        `true` if any of these happened after my `notifications_seen_at` (at any time, if I have never opened the page):
          * an invite to me (as in `my_pending_invites`)
          * an answer (accepted or declined) to an invite I sent (`invites.responded_at`)
          * a new match I have not opened (`user_listings.created_at`, `is_new = true`)
          * a group member liked a listing that is new to me (`liked_at`, and the listing is in `my_new_listing_ids`)
          * another member changed one of the group's showings (as in `my_showing_events`)
        Only says whether something happened since the last visit. Something older that is still unhandled
        (for example an invite I saw but did not answer) does not turn the dot on again.
        Must be called with GET, see the common rules.
      operationId: has_new_notifications
      responses:
        '200':
          description: '`true` or `false`.'
          content:
            application/json:
              schema: { type: boolean }

  /rpc/mark_notifications_seen:
    post:
      tags: [Notifications]
      summary: I have seen the notifications page
      description: |
        Sets my `notifications_seen_at` to now: `has_new_notifications` becomes false and every `is_unseen` in
        `my_showing_events` becomes false. Call it when the user leaves the notifications page (or after its data has loaded),
        not before loading, otherwise the page cannot highlight what was new. Refresh the dot afterwards.
      operationId: mark_notifications_seen
      responses:
        '200': { $ref: '#/components/responses/VoidOk' }
        '400':
          description: '`Ditt konto är inte aktivt`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /rpc/delete_my_account:
    post:
      tags: [Account]
      summary: Delete my account permanently
      description: |
        Deletes the signed-in user from `auth.users`. No grace period. Cascades to profile, search, matches,
        tags, sent invites and my own showings (the group's showings stay with the group).
        The group is dissolved if at most 1 member remains.
        Invites sent to my e-mail by others are deleted too, so my e-mail remains nowhere.
        An already issued JWT stays valid until it expires, but every request is blocked by RLS after deletion.
      operationId: delete_my_account
      responses:
        '200': { $ref: '#/components/responses/VoidOk' }
        '400':
          description: '`Not signed in` (English text).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ---------------------------------------------------------------------
  # Tables
  # ---------------------------------------------------------------------
  /profiles:
    get:
      tags: [Account]
      summary: Read my profile and my group members' profiles
      operationId: profiles_select
      responses:
        '200':
          description: Profiles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Profile' }
    patch:
      tags: [Account]
      summary: Update my profile
      description: |
        Filter on my own id (`?id=eq.<uid>`). Only `name`, `onboarding_completed_at`, `avatar_path` and
        `email_frequency` can be written. `group_id` and `is_active` can only change through functions,
        `last_emailed_at` only by the email script, `notifications_seen_at` only through `mark_notifications_seen`.
      operationId: profiles_update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '204': { description: Updated. }
        '400': { description: 'Constraint violated (name not 1-100 characters, avatar_path not `<own user id>/<name>.<jpg|jpeg|png|webp>` or longer than 200, email_frequency not day/week/none, error 22P02).' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /groups:
    get:
      tags: [Groups and invites]
      summary: Read my group
      description: Only my own group is visible. A group is just an id; members are the profiles with that `group_id`.
      operationId: groups_select
      responses:
        '200':
          description: My group (empty list if I have none).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, format: int64 }
                    created_at: { type: string, format: date-time }

  /invites:
    get:
      tags: [Groups and invites]
      summary: Read invites I sent, and invites addressed to my e-mail
      description: |
        Sent invites are shown with every status (the sender sees `declined`). Received invites are shown
        unless `cancelled`. To show who sent a received invite, use `my_pending_invites` instead.
      operationId: invites_select
      responses:
        '200':
          description: Invites.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Invite' }
    post:
      tags: [Groups and invites]
      summary: Send an invite
      description: |
        Only `from_user_id` (must be my id) and `to_email` can be set. Rules:
        not to my own e-mail; not to someone already in my group; `to_email` must be an e-mail address; at most one pending invite per recipient;
        at most 20 invites in total (any status) per recipient; at most 20 different recipients in the last 30 days.
        E-mail addresses are compared case-insensitively.
      operationId: invites_insert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_user_id, to_email]
              properties:
                from_user_id: { type: string, format: uuid }
                to_email: { type: string, maxLength: 254, pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$' }
      responses:
        '201': { description: Created. }
        '400':
          description: '`Ange en giltig e-postadress.`, `Personen är redan kopplad till dig.` (the recipient is already in my group), `Du har bjudit in för många olika personer. Försök igen senare` (20 recipients per 30 days), `Du har skickat för många inbjudningar till den här personen` (20 per recipient), or a check constraint (longer than 254).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { description: 'Rejected by RLS (not my id, or my own e-mail).' }
        '409': { description: There is already a pending invite to this e-mail. }
        '429': { $ref: '#/components/responses/RateLimited' }

  /search_params:
    get:
      tags: [Search]
      summary: Read my search
      operationId: search_params_select
      responses:
        '200':
          description: My search (empty list if I have not made one).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SearchParams' }
    post:
      tags: [Search]
      summary: Create my search
      description: |
        At most one per user (`user_id` is unique, a second POST gives 409; use PATCH or upsert).
        Saving triggers matching in the database: matching listings appear in `user_listings` with `is_new = true`.
        A search without a municipality matches nothing. A chosen municipality without chosen areas means the
        whole municipality. Every municipality must exist in `municipalities`, and every area must exist in `areas`
        under one of the chosen municipalities.
        At most 5 changes (insert or update) per 24 hours. Unchanged updates do not count.
      operationId: search_params_insert
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchParamsWrite' }
      responses:
        '201': { description: Created. }
        '400':
          description: |
            `Du har ändrat din sökning för många gånger. Försök igen senare`, `Okänd kommun: <namn>`,
            `Området "<namn>" finns inte i någon av dina valda kommuner`, an unknown property type
            (error 22P02, invalid enum value), or a check constraint (min greater than max for price or rooms,
            a value outside its range, more than 10 municipalities or 200 areas).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { description: I already have a search. }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      tags: [Search]
      summary: Update my search
      description: 'Same rules and limits as POST. Matching is re-run: new matches are added, and old matches that no longer fit are removed, except liked, tagged and removed listings.'
      operationId: search_params_update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchParamsWrite' }
      responses:
        '204': { description: Updated. }
        '400':
          description: Same errors as POST.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Search]
      summary: Delete my search
      operationId: search_params_delete
      responses:
        '204': { description: Deleted. }
        '429': { $ref: '#/components/responses/RateLimited' }

  /user_listings:
    get:
      tags: [Listings]
      summary: Read matches (mine and my group members')
      description: |
        Use `select=*,listings(*)` to get the listing in the same request. Filter on `user_id` for only mine.
        A match is kept when the user has liked or tagged the listing, even if the search no longer fits.
        Add `in_search=eq.true` for the search feed: only listings that match my current search.
      operationId: user_listings_select
      responses:
        '200':
          description: Matches.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserListing' }
    patch:
      tags: [Listings]
      summary: Remove a like
      description: Only my own rows, and only `liked` can be written. Use `like_listing` to like and `mark_listing_seen` to mark as seen.
      operationId: user_listings_update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                liked: { type: boolean }
      responses:
        '204': { description: Updated. }
        '429': { $ref: '#/components/responses/RateLimited' }

  /listings:
    get:
      tags: [Listings]
      summary: Read listings matched to me or to someone in my group, or that my group (or I) have a showing for
      description: |
        Shared scraped data, read only. Listings where `removed_at` is set have disappeared from the agency's site:
        show them as "Hittas inte". They are deleted 10 days after `removed_at` (daily cleanup by pg_cron).
        `ld_json` is the raw schema.org data from the agency.
      operationId: listings_select
      responses:
        '200':
          description: Listings.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Listing' }

  /showings:
    get:
      tags: [Showings]
      summary: Read my group's showings, or my own if I have no group
      description: |
        Planned showings entered by hand (not an official booking). Use `select=*,listings(*)` to get the listing:
        the listing stays readable as long as the showing exists, even if nobody matches it any more.
        Deleted by pg_cron 30 days after `showing_date`.
        Creating, changing and deleting a group showing is logged for the other members' notifications (`my_showing_events`).
      operationId: showings_select
      responses:
        '200':
          description: Showings.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Showing' }
    post:
      tags: [Showings]
      summary: Add a showing
      description: |
        Do not send `group_id` or `user_id`: the database sets my group, or me if I have no group.
        The listing must be visible to me. One showing per listing and owner. At most 50 per owner.
      operationId: showings_insert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listing_id, showing_date]
              properties:
                listing_id: { type: integer, format: int64 }
                showing_date: { type: string, format: date, description: '2000-01-01 – 2099-12-31. An invalid date (e.g. 2027-02-29) gives 400 with code 22008.' }
                start_time: { type: string, nullable: true, example: '17:30' }
                note: { type: string, nullable: true, maxLength: 500 }
      responses:
        '201': { description: Created. }
        '400':
          description: '`Gruppen har redan max antal visningar (50)`, `Du har redan max antal visningar (50)`, or a check constraint (note longer than 500, date outside 2000-2099).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { description: Rejected by RLS (the listing is not visible to me, or my account is not active). }
        '409': { description: 'There is already a showing for this listing (code 23505).' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      tags: [Showings]
      summary: Change a showing
      description: Any member of the group can change the group's showings. Only `showing_date`, `start_time` and `note` can be written.
      operationId: showings_update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                showing_date: { type: string, format: date, description: '2000-01-01 – 2099-12-31. An invalid date (e.g. 2027-02-29) gives 400 with code 22008.' }
                start_time: { type: string, nullable: true }
                note: { type: string, nullable: true, maxLength: 500 }
      responses:
        '204': { description: Updated. }
        '400':
          description: A check constraint (note longer than 500, date outside 2000-2099), or an invalid date.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Showings]
      summary: Delete a showing
      description: Any member of the group can delete the group's showings.
      operationId: showings_delete
      responses:
        '204': { description: Deleted. }
        '429': { $ref: '#/components/responses/RateLimited' }

  /municipalities:
    get:
      tags: [Search]
      summary: Read Sweden's municipalities
      description: Reference data, read only. The only valid values for `search_params.municipalities`.
      operationId: municipalities_select
      responses:
        '200':
          description: Municipalities.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, format: int64 }
                    name: { type: string }
                    county_id: { type: integer, format: int64 }

  /areas:
    get:
      tags: [Search]
      summary: Read the areas a municipality can be narrowed down to
      description: |
        Reference data, read only, entered by hand. Save `name` in `search_params.areas`;
        show `display_name` when it is set, otherwise `name`.
      operationId: areas_select
      responses:
        '200':
          description: Areas.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, format: int64 }
                    municipality_id: { type: integer, format: int64 }
                    name: { type: string }
                    display_name: { type: string, nullable: true }

  /counties:
    get:
      tags: [Search]
      summary: Read Sweden's counties
      description: Reference data, read only. Only used to group municipalities; a search never stores a county.
      operationId: counties_select
      responses:
        '200':
          description: Counties.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, format: int64 }
                    name: { type: string }

  /user_tags:
    get:
      tags: [Tags]
      summary: Read my tags
      operationId: user_tags_select
      responses:
        '200':
          description: My tags.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserTag' }
    post:
      tags: [Tags]
      summary: Create a tag
      description: '`user_id` must be my id. `tag_name` is 1-20 characters, not only whitespace, and unique per user (otherwise 409). At most 30 tags per user.'
      operationId: user_tags_insert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, tag_name]
              properties:
                user_id: { type: string, format: uuid }
                tag_name: { type: string, minLength: 1, maxLength: 20, pattern: '\S' }
      responses:
        '201': { description: Created. }
        '400':
          description: '`Du har redan max antal kategorier (30)`, or a check constraint (name only whitespace).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { description: I already have a tag with this name. }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      tags: [Tags]
      summary: Rename a tag
      operationId: user_tags_update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tag_name: { type: string, minLength: 1, maxLength: 20, pattern: '\S' }
      responses:
        '204': { description: Updated. }
        '400':
          description: A check constraint (name only whitespace).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Tags]
      summary: Delete a tag
      description: Its `listing_tags` rows are deleted with it (cascade).
      operationId: user_tags_delete
      responses:
        '204': { description: Deleted. }
        '429': { $ref: '#/components/responses/RateLimited' }

  /listing_tags:
    get:
      tags: [Tags]
      summary: Read my tags on listings
      operationId: listing_tags_select
      responses:
        '200':
          description: Tag applications.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ListingTag' }
    post:
      tags: [Tags]
      summary: Tag a listing
      description: Both the tag and the `user_listings` row must be mine. A tagged listing is kept when the search changes.
      operationId: listing_tags_insert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_tag_id, user_listing_id]
              properties:
                user_tag_id: { type: integer, format: int64 }
                user_listing_id: { type: integer, format: int64 }
      responses:
        '201': { description: Created. }
        '403': { description: The tag or the match is not mine. }
        '409': { description: The listing already has this tag. }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Tags]
      summary: Remove a tag from a listing
      operationId: listing_tags_delete
      responses:
        '204': { description: Deleted. }
        '429': { $ref: '#/components/responses/RateLimited' }

components:
  securitySchemes:
    apikey:
      type: apiKey
      in: header
      name: apikey
      description: The project's anon (publishable) key. supabase-js sets it.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The signed-in user's access token. supabase-js sets it.

  responses:
    VoidOk:
      description: Done. The function returns nothing (`null` body).
    RateLimited:
      description: More than 100 write requests in 5 minutes.
      headers:
        Retry-After:
          schema: { type: string, example: '60' }
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: string, example: rate_limited }
              message: { type: string, example: 'Too many requests, try again in a moment' }

  schemas:
    Error:
      type: object
      description: PostgREST error. For our own rules `message` holds the Swedish text.
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: string, nullable: true }
        hint: { type: string, nullable: true }

    PropertyType:
      type: string
      enum: [villa, radhus, lagenhet, fritidshus, tomt, other]
      description: Postgres enum `public.property_type`

    Profile:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        group_id: { type: integer, format: int64, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        onboarding_completed_at: { type: string, format: date-time, nullable: true }
        avatar_path:
          type: string
          nullable: true
          description: 'Path in the public `avatars` bucket, `<user id>/<name>.<jpg|jpeg|png|webp>`. Build the URL with `supabase.storage.from(''avatars'').getPublicUrl(path)`'
        email_frequency: { $ref: '#/components/schemas/EmailFrequency' }
        last_emailed_at: { type: string, format: date-time, nullable: true, description: When the last email was sent. Read-only }
        notifications_seen_at: { type: string, format: date-time, nullable: true, description: 'When I last opened the notifications page (null = never). Set with mark_notifications_seen. Read-only' }

    ShowingEvent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        created_at: { type: string, format: date-time, description: When the change was made }
        action: { type: string, enum: [created, updated, deleted], description: Postgres enum `public.showing_event_action` }
        actor_id: { type: string, format: uuid, description: The member who made the change }
        actor_name: { type: string }
        listing_id: { type: integer, format: int64 }
        address: { type: string, nullable: true }
        showing_date: { type: string, format: date, description: 'The date after the change (before it for deleted)' }
        start_time: { type: string, format: time, nullable: true, example: '17:30:00' }
        is_unseen: { type: boolean, description: Newer than my notifications_seen_at }

    ProfileUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        onboarding_completed_at: { type: string, format: date-time, nullable: true }
        avatar_path:
          type: string
          nullable: true
          maxLength: 200
          pattern: '^[0-9a-f-]{36}/[A-Za-z0-9_-]+\.(jpg|jpeg|png|webp)$'
          description: 'Must start with the own user id. It is not checked that the file exists, so upload the file first'
        email_frequency: { $ref: '#/components/schemas/EmailFrequency' }

    EmailFrequency:
      type: string
      enum: [day, week, none]
      default: day
      description: 'Postgres enum `public.email_frequency`. How often the email is sent (about 07:00 Swedish time): day = every morning, week = Friday mornings, none = never. Covers both new matches and group members'' likes'

    Invite:
      type: object
      properties:
        id: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        from_user_id: { type: string, format: uuid }
        to_email: { type: string }
        status: { type: string, enum: [pending, accepted, declined, cancelled], description: Postgres enum `public.invite_status` }
        responded_at: { type: string, format: date-time, nullable: true }

    PendingInvite:
      type: object
      properties:
        id: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        from_user_id: { type: string, format: uuid }
        from_name: { type: string }
        from_email: { type: string }

    GroupMember:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        avatar_path: { type: string, nullable: true, description: Path in the `avatars` bucket. Build the URL with getPublicUrl(). }
        email: { type: string }

    SearchParamsWrite:
      type: object
      description: |
        Empty `property_types` means all types. Null on a limit means no limit.
        `include_new_construction` null counts as true (new builds are hidden only when false).
        Listings with an unknown value for a filtered field (price, rooms, fee, area) still match.
      properties:
        user_id: { type: string, format: uuid, description: Required on POST. Must be my id. }
        property_types:
          type: array
          items: { $ref: '#/components/schemas/PropertyType' }
        municipalities: { type: array, maxItems: 10, items: { type: string }, description: Names from `municipalities` }
        areas: { type: array, maxItems: 200, items: { type: string }, description: 'Names (not display_name) from `areas`, each under one of the chosen municipalities' }
        min_price: { type: integer, format: int64, nullable: true, minimum: 0, maximum: 1000000000 }
        max_price: { type: integer, format: int64, nullable: true, minimum: 0, maximum: 1000000000 }
        min_rooms: { type: number, nullable: true, exclusiveMinimum: true, minimum: 0, maximum: 100 }
        max_rooms: { type: number, nullable: true, exclusiveMinimum: true, minimum: 0, maximum: 100 }
        max_monthly_fee: { type: integer, format: int64, nullable: true, minimum: 0, maximum: 100000 }
        min_living_area: { type: number, nullable: true, minimum: 0, maximum: 10000 }
        include_new_construction: { type: boolean, nullable: true, default: true }

    SearchParams:
      allOf:
        - $ref: '#/components/schemas/SearchParamsWrite'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            created_at: { type: string, format: date-time }

    UserListing:
      type: object
      properties:
        id: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        user_id: { type: string, format: uuid }
        listing_id: { type: integer, format: int64 }
        is_new: { type: boolean, description: 'true until the user has opened the listing page or liked it. A new match for a listing the user has already opened starts as false. Only says something about my own rows: use my_new_listing_ids for the "NEW" flag in every list' }
        liked: { type: boolean }
        liked_at: { type: string, format: date-time, nullable: true, description: When liked last became true. Set by the database, read-only }
        in_search: { type: boolean, description: 'true when the listing matches my current search. false for rows kept because they are liked, tagged or removed, and for rows created by liking a group member''s listing. Set by match_user_listings(), read-only. The search feed shows only true' }

    Listing:
      type: object
      properties:
        id: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        agency: { type: string }
        external_id: { type: integer, format: int64 }
        url: { type: string, maxLength: 500, pattern: '^https://' }
        ld_json: { type: object, description: 'Raw schema.org data from the agency. Max 300 000 bytes as text' }
        last_seen_at: { type: string, format: date-time }
        removed_at: { type: string, format: date-time, nullable: true, description: Set when the listing disappeared from the agency's site, or was not seen for 7 days while someone had it in a list or showing. Deleted after 10 days. }
        property_type: { $ref: '#/components/schemas/PropertyType' }
        municipality: { type: string, nullable: true, description: 'A name from `municipalities` (null when the agency''s name is unknown)' }
        area: { type: string, nullable: true, maxLength: 100 }
        price: { type: integer, format: int64, nullable: true, minimum: 1, maximum: 1000000000 }
        rooms: { type: number, nullable: true, exclusiveMinimum: true, minimum: 0, maximum: 100 }
        latitude: { type: number, nullable: true, minimum: 55, maximum: 70 }
        longitude: { type: number, nullable: true, minimum: 10, maximum: 25 }
        monthly_fee: { type: integer, format: int64, nullable: true, minimum: 1, maximum: 100000, description: Apartments only }
        living_area: { type: number, nullable: true, exclusiveMinimum: true, minimum: 0, maximum: 10000 }
        is_new_construction: { type: boolean }
        address: { type: string, nullable: true, maxLength: 300 }
        image_url: { type: string, nullable: true, maxLength: 500, pattern: '^https://' }
        description: { type: string, nullable: true, maxLength: 5000, description: The app cuts it for the UI }
        floor_level: { type: integer, nullable: true, minimum: -5, maximum: 100, description: Apartments only }
        plot_area: { type: integer, format: int64, nullable: true, minimum: 0, maximum: 10000000, description: Houses }
        build_year: { type: integer, nullable: true, minimum: 1000, maximum: 2100 }

    Showing:
      type: object
      properties:
        id: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        group_id: { type: integer, format: int64, nullable: true, description: Set while the owner is a group }
        user_id: { type: string, format: uuid, nullable: true, description: Set when the owner is a user without a group }
        listing_id: { type: integer, format: int64 }
        showing_date: { type: string, format: date }
        start_time: { type: string, nullable: true, example: '17:30:00' }
        note: { type: string, nullable: true, maxLength: 500 }

    SkippedShowing:
      type: object
      properties:
        address: { type: string, nullable: true }
        url: { type: string }
        showing_date: { type: string, format: date }
        start_time: { type: string, nullable: true }

    UserTag:
      type: object
      properties:
        id: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        user_id: { type: string, format: uuid }
        tag_name: { type: string }

    ListingTag:
      type: object
      properties:
        id: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        user_tag_id: { type: integer, format: int64 }
        user_listing_id: { type: integer, format: int64 }
